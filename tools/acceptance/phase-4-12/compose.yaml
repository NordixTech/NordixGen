name: nordixgen-phase-4-12-acceptance

services:
  postgres:
    image: postgres:17-alpine
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: nordixgen-local-test
      POSTGRES_DB: nordix_test
    ports:
      - "55432:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres -d nordix_test"]
      interval: 2s
      timeout: 3s
      retries: 20

  neon-http-proxy:
    image: ghcr.io/timowilhelm/local-neon-http-proxy@sha256:cd2ae14edf2feafbc3330492de5c80506f77274c3bd013154cdef697bdeb768a
    environment:
      PG_CONNECTION_STRING: postgres://postgres:nordixgen-local-test@postgres:5432/nordix_test
    ports:
      - "4444:4444"
    depends_on:
      postgres:
        condition: service_healthy
