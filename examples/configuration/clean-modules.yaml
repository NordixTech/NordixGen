# Accepted YAML v2 configuration for Clean modular generation.
schemaVersion: 2
name: clean-commerce
version: 1.0.0
repositories:
  - name: app
    path: .
databases:
  primary: {}
backends:
  - name: api
    repository: app
    path: apps/api
    persistence: { database: primary }
    modules:
      customers:
        architecture: clean
        entities: [ Customer, CustomerAddress ]
        exports: [ getCustomer ]
      billing:
        architecture: clean
        entities: [ Invoice ]
        imports:
          customers: [ getCustomer ]
    authentication: {}
    authorization:
      global:
        roles:
          - admin
          - viewer
        adminRole: admin
        defaultRole: viewer
        rolePermissions:
          viewer:
            - customers:read
            - invoices:read
frontends:
  - name: web
    repository: app
    path: apps/web
    connectsTo: [ api ]
    access:
      mode: mixed
      backend: api
      publicRoutes: [ "/", /customer ]
entities:
  Customer:
    backend: api
    fields:
      name: { type: string, minLength: 1, maxLength: 200 }
      email: { type: string, unique: true }
    relations:
      addresses: { type: one-to-many, target: CustomerAddress, foreignKey: customerId }
    timestamps: { createdAt: true, updatedAt: true }
    softDelete: timestamp
  CustomerAddress:
    backend: api
    fields:
      street: { type: string }
    relations:
      customer:
        type: many-to-one
        target: Customer
        foreignKey: customerId
        required: true
        onDelete: cascade
  Invoice:
    backend: api
    fields:
      customerId: { type: uuid }
      total: { type: number, format: decimal }
      note: { type: string, required: false }
      issuedAt: { type: date, default: { kind: now } }
pagination:
  standard: { defaultPageSize: 20, maxPageSize: 80 }
endpoints:
  - backend: api
    entity: Customer
    operationId: listCustomers
    method: GET
    path: /api/customers
    authRequired: false
    queryParams:
      - name: name
        field: { entity: Customer, field: name }
        required: false
        operator: contains
    joins:
      - entity: CustomerAddress
        type: left
        fields: [ id, street ]
    pagination: standard
  - backend: api
    entity: Customer
    operationId: getCustomer
    method: GET
    path: /api/customers/{customerId}
    permissions: [ customers:read ]
    pathParams:
      - name: customerId
        field: { entity: Customer, field: id }
  - backend: api
    entity: Customer
    operationId: createCustomer
    method: POST
    path: /api/customers
    permissions: [ customers:write ]
    requestBody: { useCase: { entity: Customer, operation: create } }
  - backend: api
    entity: Customer
    operationId: updateCustomer
    method: PATCH
    path: /api/customers/{customerId}
    permissions: [ customers:write ]
    pathParams:
      - name: customerId
        field: { entity: Customer, field: id }
    requestBody: { useCase: { entity: Customer, operation: update } }
  - backend: api
    entity: Customer
    operationId: deleteCustomer
    method: DELETE
    path: /api/customers/{customerId}
    permissions: [ customers:write ]
    pathParams:
      - name: customerId
        field: { entity: Customer, field: id }
  - backend: api
    entity: Invoice
    operationId: listInvoices
    method: GET
    path: /api/invoices
    permissions: [ invoices:read ]
