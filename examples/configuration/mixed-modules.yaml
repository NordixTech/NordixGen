# Executable YAML v2 configuration with per-module architecture selection.
schemaVersion: 2
name: client-platform
version: 1.0.0
repositories:
  - name: app
    path: .
databases:
  primary: {}
backends:
  - name: api
    repository: app
    path: apps/api
    persistence: { database: primary }
    modules:
      customers:
        architecture: clean
        entities: [ Customer ]
        exports: [ getCustomer ]
      billing:
        architecture: hexagonal
        entities: [ Invoice ]
        imports:
          customers: [ getCustomer ]
      reporting:
        architecture: onion
        entities: [ Report ]
    authentication:
      methods: [ email-password ]
    authorization:
      global:
        roles:
          - admin
          - viewer
          - accountant
        adminRole: admin
        defaultRole: viewer
        rolePermissions:
          viewer:
            - customers:read
          accountant:
            - invoices:read
frontends:
  - name: web
    repository: app
    path: apps/web
    connectsTo: [ api ]
    access: { mode: authenticated, backend: api }
entities:
  Customer:
    backend: api
    fields:
      name: { type: string, minLength: 1 }
  Invoice:
    backend: api
    fields:
      customerId: { type: uuid }
      total: { type: number, format: decimal, precision: 10, scale: 2 }
  Report:
    backend: api
    fields:
      title: { type: string }
endpoints:
  - backend: api
    entity: Customer
    operationId: getCustomer
    method: GET
    path: /api/customers/{customerId}
    permissions: [ customers:read ]
    pathParams:
      - name: customerId
        field: { entity: Customer, field: id }
  - backend: api
    entity: Invoice
    operationId: listInvoices
    method: GET
    path: /api/invoices
    permissions: [ invoices:read ]
  - backend: api
    entity: Report
    operationId: listReports
    method: GET
    path: /api/reports
