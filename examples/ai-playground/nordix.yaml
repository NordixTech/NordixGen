schemaVersion: 2
name: ai-playground
version: 1.0.0
organizations: []
repositories:
  - name: app
    path: .
    initializeGit: true
    createRemote: false
    visibility: private
databases:
  primary: {}
backends:
  - name: api
    repository: app
    path: apps/api
    persistence:
      database: primary
    modules:
      notes:
        architecture: clean
        entities:
          - Note
        exports: []
        imports: {}
    authentication:
      methods:
        - email-password
    authorization:
      roles:
        - admin
        - member
        - reader
        - editor
      adminRole: admin
      defaultRole: reader
      rolePermissions:
        member:
          - notes:read
          - notes:write
        reader:
          - notes:read
        editor:
          - notes:read
          - notes:write
    ai:
      enabled: true
      mcp:
        enabled: true
        authMethods:
          - oauth
          - api-key
frontends:
  - name: web
    repository: app
    path: apps/web
    connectsTo:
      - api
    access:
      mode: public
    ai:
      enabled: true
      backend: api
      chat:
        enabled: true
        placement: page
      connectPortal:
        enabled: true
enums: {}
entities:
  Note:
    backend: api
    fields:
      title:
        required: true
        unique: false
        type: string
        minLength: 1
        maxLength: 200
      content:
        required: false
        unique: false
        type: string
    relations: {}
    timestamps:
      createdAt: true
      updatedAt: true
    softDelete: timestamp
pagination:
  standard:
    strategy: offset
    pageParam: page
    pageSizeParam: pageSize
    defaultPageSize: 25
    maxPageSize: 100
endpoints:
  - backend: api
    path: /api/notes
    method: GET
    operationId: listNotes
    entity: Note
    roles: []
    permissions:
      - notes:read
    queryParams:
      - name: title
        field:
          entity: Note
          field: title
        required: false
        operator: contains
    pathParams: []
    pagination: standard
    joins: []
  - backend: api
    entity: Note
    operationId: createNote
    method: POST
    path: /api/notes
    permissions:
      - notes:write
    audit: true
    requestBody:
      useCase:
        entity: Note
        operation: create
