name: nordix-invalid-orm
version: 1.0.0
repositories:
  - name: workspace
    path: .
backends:
  - name: api
    framework: hono
    architecture: clean
    repository: workspace
    path: apps/api
    persistence:
      database: commerce-db
      orm: missing-orm
databases:
  commerce-db:
    engine: postgres
    provider: neon
entities:
  User:
    backend: api
    fields:
      email:
        type: string
        unique: true
