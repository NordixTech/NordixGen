name: nordix-invalid-endpoint-entity
version: 1.0.0
repositories:
  - name: workspace
    path: .
backends:
  - name: api
    framework: hono
    architecture: clean
    repository: workspace
    path: apps/api
entities:
  User:
    backend: api
    fields:
      email:
        type: string
        unique: true
endpoints:
  - path: /api/missing
    method: GET
    backend: api
    entity: MissingEntity
