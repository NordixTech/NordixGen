# yaml-language-server: $schema=../nordix.schema.json
name: nordix-shop
version: 1.0.0
description: Example SaaS commerce configuration for NordixGen.
organizations:
  - name: nordix
    provider: github
    handle: NordixTech

repositories:
  - name: commerce-platform
    path: .
    organization: nordix
    initializeGit: true
    createRemote: false

frontends:
  - name: store-web
    framework: nextjs
    type: web
    styling: tailwind
    stateManagement:
      client: zustand
      server: tanstack-query
      generateHooks: true
      optimisticUpdates: true
    repository: commerce-platform
    connectsTo: [core-api]
    authUI: true
    path: apps/store-web

backends:
  - name: core-api
    framework: hono
    architecture: clean
    path: apps/api-core
    repository: commerce-platform
    auth:
      type: jwt
      providers: [credentials, google, github]
      roles: [admin, manager, customer]
      permissions: [products:create, orders:cancel, orders:read]
      twoFactor: true
      passwordRecovery: true
    persistence:
      database: commerce-db
      orm: drizzle
  - name: worker-notifications
    framework: hono
    architecture: modular
    path: apps/worker-notifications
    repository: commerce-platform
    auth:
      type: none

databases:
  commerce-db:
    engine: postgres
    provider: neon

docker:
  postgres: true
  mailpit: true
  minio: true
  redis: true

llm:
  enabled: true
  exposeUseCases: true
  endpoint: /api/agent

deployment:
  provider: cloudflare
  ci: cloudflare-native
  iac: terraform

enums:
  UserRole: [ADMIN, MANAGER, CUSTOMER]
  ProductStatus: [DRAFT, PUBLISHED, ARCHIVED]
  OrderStatus: [PENDING, PAID, SHIPPED, CANCELLED]

entities:
  User:
    backend: core-api
    description: User account and access profile.
    fields:
      email:
        type: string
        required: true
        unique: true
      role:
        type: enum
        enumName: UserRole
        default: CUSTOMER
    timestamps:
      createdAt: true
      updatedAt: true
    softDelete: timestamp

  Product:
    backend: core-api
    description: Catalog item.
    fields:
      name:
        type: string
        required: true
        maxLength: 180
      sku:
        type: string
        required: true
        unique: true
      price:
        type: number
        format: decimal
        required: true
      status:
        type: enum
        enumName: ProductStatus
        default: DRAFT
    relations:
      category:
        type: many-to-one
        target: Category
        foreignKey: category_id
        onDelete: set-null
    timestamps:
      createdAt: true
      updatedAt: true
    softDelete: timestamp

  Category:
    backend: core-api
    fields:
      name:
        type: string
        required: true
        unique: true
    timestamps:
      createdAt: true
      updatedAt: false
    softDelete: timestamp

  Order:
    backend: core-api
    fields:
      orderNumber:
        type: string
        required: true
        unique: true
      status:
        type: enum
        enumName: OrderStatus
        default: PENDING
    relations:
      customer:
        type: many-to-one
        target: User
        foreignKey: user_id
        onDelete: restrict
      items:
        type: one-to-many
        target: OrderItem
        foreignKey: order_id
    timestamps:
      createdAt: true
      updatedAt: true
    softDelete: timestamp

  OrderItem:
    backend: core-api
    fields:
      quantity:
        type: number
        format: integer
        default: 1
      unitPrice:
        type: number
        format: decimal
        required: true
    relations:
      order:
        type: many-to-one
        target: Order
        foreignKey: order_id
        onDelete: cascade
      product:
        type: many-to-one
        target: Product
        foreignKey: product_id
        onDelete: restrict
    timestamps:
      createdAt: true
      updatedAt: true

endpoints:
  - path: /api/orders/summary
    method: GET
    backend: core-api
    summary: List orders with their customer and line items.
    entity: Order
    authRequired: true
    roles: [admin, manager]
    permissions: [orders:read]
    queryParams:
      - name: status
        type: enum
        enumName: OrderStatus
        required: false
    joins:
      - entity: User
        type: inner
        fields: [id, email]
      - entity: OrderItem
        type: left
        fields: [id, quantity, unitPrice]
