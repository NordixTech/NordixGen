# Performance fixture: synthetic workload, one backend and two frontends.
# Generate into ./generated; generated code, credentials and measurements are not versioned.
schemaVersion: 2
name: ng-perf117-1021
version: 1.0.0
repositories:
  - name: app
    path: .
    initializeGit: true
    createRemote: false
databases:
  primary: {}
iac:
  cloudflare:
    r2_storage:
      documents:
        visibility: private
      assets:
        visibility: public
backends:
  - name: api
    repository: app
    path: apps/api
    persistence:
      database: primary
    iac:
      r2_storage:
        - documents
        - assets
    modules:
      commerce:
        architecture: clean
        entities:
          - Customer
          - Address
          - Category
          - Product
          - Order
          - OrderItem
          - Payment
          - Shipment
    authentication:
      methods:
        - email-password
        - phone-number
      identityProviders: []
      passwordPolicy:
        minLength: 12
        requireUppercase: true
        requireLowercase: true
        requireNumber: true
        requireSpecialChar: true
      rateLimit:
        enabled: true
        window: 60s
        max: 1000
        ip:
          window: 60s
          max: 1000
        account:
          window: 15m
          max: 100
    authorization:
      roles:
        - admin
        - manager
        - operator
        - customer
        - guest
      adminRole: admin
      defaultRole: guest
      rolePermissions:
        manager:
          - customer:read
          - customer:write
          - address:read
          - address:write
          - category:read
          - category:write
          - product:read
          - product:write
          - order:read
          - order:write
          - orderitem:read
          - orderitem:write
          - payment:read
          - payment:write
          - shipment:read
          - shipment:write
          - storage:documents:read
          - storage:assets:read
          - storage:documents:write
          - storage:assets:write
        operator:
          - customer:read
          - address:read
          - category:read
          - product:read
          - order:read
          - orderitem:read
          - payment:read
          - shipment:read
          - storage:documents:read
          - storage:assets:read
        customer:
          - customer:read
          - address:read
          - category:read
          - product:read
          - order:read
          - orderitem:read
          - payment:read
          - shipment:read
        guest: []
frontends:
  - name: web
    repository: app
    path: apps/web
    connectsTo:
      - api
    access:
      mode: mixed
      backend: api
      publicRoutes:
        - /
        - /product
  - name: portal
    repository: app
    path: apps/portal
    connectsTo:
      - api
    access:
      mode: mixed
      backend: api
      publicRoutes:
        - /
        - /product
entities:
  Customer:
    backend: api
    fields:
      name:
        type: string
        maxLength: 160
      email:
        type: string
        unique: true
    timestamps:
      createdAt: true
      updatedAt: true
    softDelete: timestamp
    relations:
      addresses:
        type: one-to-many
        target: Address
        foreignKey: customerId
      orders:
        type: one-to-many
        target: Order
        foreignKey: customerId
  Address:
    backend: api
    fields:
      street:
        type: string
        maxLength: 160
      city:
        type: string
        maxLength: 160
    relations:
      customer:
        type: many-to-one
        target: Customer
        foreignKey: customerId
        required: true
        onDelete: cascade
  Category:
    backend: api
    fields:
      name:
        type: string
        maxLength: 160
    relations:
      products:
        type: one-to-many
        target: Product
        foreignKey: categoryId
  Product:
    backend: api
    fields:
      name:
        type: string
        maxLength: 160
      sku:
        type: string
        unique: true
      price:
        type: number
        format: decimal
        precision: 10
        scale: 2
      stock:
        type: number
        format: integer
    relations:
      category:
        type: many-to-one
        target: Category
        foreignKey: categoryId
        required: true
        onDelete: cascade
    timestamps:
      createdAt: true
      updatedAt: true
    softDelete: timestamp
  Order:
    backend: api
    fields:
      reference:
        type: string
        unique: true
      status:
        type: string
        maxLength: 160
      total:
        type: number
        format: decimal
        precision: 10
        scale: 2
    relations:
      customer:
        type: many-to-one
        target: Customer
        foreignKey: customerId
        required: true
        onDelete: cascade
      items:
        type: one-to-many
        target: OrderItem
        foreignKey: orderId
      payments:
        type: one-to-many
        target: Payment
        foreignKey: orderId
      shipments:
        type: one-to-many
        target: Shipment
        foreignKey: orderId
    timestamps:
      createdAt: true
      updatedAt: true
    softDelete: timestamp
    indexes:
      - fields:
          - customerId
          - createdAt
  OrderItem:
    backend: api
    fields:
      quantity:
        type: number
        format: integer
      unitPrice:
        type: number
        format: decimal
        precision: 10
        scale: 2
    relations:
      order:
        type: many-to-one
        target: Order
        foreignKey: orderId
        required: true
        onDelete: cascade
      product:
        type: many-to-one
        target: Product
        foreignKey: productId
        required: true
        onDelete: cascade
    indexes:
      - fields:
          - orderId
          - id
  Payment:
    backend: api
    fields:
      amount:
        type: number
        format: decimal
        precision: 10
        scale: 2
      status:
        type: string
        maxLength: 160
    relations:
      order:
        type: many-to-one
        target: Order
        foreignKey: orderId
        required: true
        onDelete: cascade
    timestamps:
      createdAt: true
      updatedAt: true
    indexes:
      - fields:
          - orderId
          - id
  Shipment:
    backend: api
    fields:
      trackingCode:
        type: string
        maxLength: 160
      status:
        type: string
        maxLength: 160
    relations:
      order:
        type: many-to-one
        target: Order
        foreignKey: orderId
        required: true
        onDelete: cascade
    timestamps:
      createdAt: true
      updatedAt: true
pagination:
  standard:
    defaultPageSize: 50
    maxPageSize: 100
